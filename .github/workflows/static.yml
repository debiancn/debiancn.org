# Simple workflow for deploying static content to GitHub Pages
name: update debiancn.org index page to Pages

on:
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron: '00 23 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update_files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3.5.2
        with:
          repository: debiancn/debiancn-home
      - name: apt update
        run: sudo apt update
      - name: install xsltproc
        run: sudo apt install xsltproc
      - name: generate index page
        run: make
      - name: collect referenced static assets
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy
          cp index.html privacy-terms.html deploy/
          # 页面中引用的 ./css ./js ./images 资源，以及样式表 url(...) 引用的资源
          {
            grep -ohE '\./(css|js|images)/[A-Za-z0-9._/-]+' index.html privacy-terms.html repo.html || true
            grep -ohE 'url\(\.\./[A-Za-z0-9._/-]+\)' css/*.css || true
          } | sed -E 's|^\./||; s|^url\(\.\./||; s|\)$||' | sort -u > .deploy-refs
          while IFS= read -r f; do
            if [ -f "$f" ]; then
              mkdir -p "deploy/$(dirname "$f")"
              cp -p "$f" "deploy/$f"
            else
              echo "warning: referenced asset not found: $f" >&2
            fi
          done < .deploy-refs
          rm -f .deploy-refs
          find deploy -type f | sort
      - name: Archive new page
        uses: actions/upload-artifact@v4
        with:
          name: site-update
          path: deploy/
  check:
    needs: update_files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: site-update
          path: new-site
      - run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          rm -rf css js images index.html privacy-terms.html
          cp -a new-site/index.html new-site/privacy-terms.html .
          for d in css js images; do
            if [ -d "new-site/$d" ]; then
              cp -a "new-site/$d" .
            fi
          done
          rm -rf new-site
          git add -A
          git status
          git commit -m "action auto update" || echo "nothing to update"
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
